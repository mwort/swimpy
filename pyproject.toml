[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swimpy"
version = "0.5.0"
description = "A python package to run, test and read/write the IO of the ecohydrological model SWIM."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Michel Wortmann", email = "wortmann@pik-potsdam.de" }
]
keywords = ["swimpy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
]
requires-python = ">=3.6"
dependencies = [
    "pandas>=0.23.4",
    "django>=3.0",
    "parse>=1.9,<2.0",
    "matplotlib>=2.2.3",
    "model-manager>=0.8",
    "f90nml>=1.4",
    "evoalgos>=1.0",
    "netCDF4>=1.7",
]

[project.urls]
Homepage = "https://github.com/mwort/swimpy"

[tool.setuptools]
script-files = ["swimpy/scripts/swimpy"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["resources/**/*"]

[tool.bumpversion]
current_version = "0.5.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "swimpy/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[tool.flake8]
exclude = ["docs"]
